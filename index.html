<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小小超级玛丽</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(#7ec0ee 0%, #b5e0ff 60%, #e9f7ff 100%);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #0d2b45;
      min-height: 100vh;
      user-select: none;
    }

    header {
      text-align: center;
      padding: 16px 12px 4px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    p {
      margin: 6px 0 0;
      font-size: 14px;
      color: #17324a;
    }

    canvas {
      border: 3px solid #17324a;
      border-radius: 8px;
      background: linear-gradient(#8ad5ff 0%, #b8ecff 60%, #d4f6ff 100%);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      image-rendering: pixelated;
    }

    .hud {
      margin-top: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-weight: 600;
    }

    .pill {
      background: #17324a;
      color: #fdfdfd;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>
  <header>
    <h1>小小超级玛丽</h1>
    <p>方向键 ← → 移动，空格跳跃，R 重新开始。碰到敌人会"阵亡"，立即原地复活并短暂无敌。</p>
  </header>
  <canvas id="game" width="960" height="540"></canvas>
  <div class="hud">
    <span class="pill" id="status">准备冒险</span>
    <span class="pill" id="stats">分数：0 · 关卡长度：无限循环</span>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const statsEl = document.getElementById("stats");

    const keys = { left: false, right: false, jump: false, restart: false };
    document.addEventListener("keydown", (e) => {
      if (["ArrowLeft", "a", "A"].includes(e.key)) keys.left = true;
      if (["ArrowRight", "d", "D"].includes(e.key)) keys.right = true;
      if (e.code === "Space" || e.key === "w" || e.key === "W" || e.key === "ArrowUp") keys.jump = true;
      if (e.key === "r" || e.key === "R") keys.restart = true;
    });
    document.addEventListener("keyup", (e) => {
      if (["ArrowLeft", "a", "A"].includes(e.key)) keys.left = false;
      if (["ArrowRight", "d", "D"].includes(e.key)) keys.right = false;
      if (e.code === "Space" || e.key === "w" || e.key === "W" || e.key === "ArrowUp") keys.jump = false;
      if (e.key === "r" || e.key === "R") keys.restart = false;
    });

    const GRAVITY = 0.6;
    const FRICTION = 0.82;
    const MOVE_SPEED = 4;
    const JUMP_FORCE = 12.5;
    const INVULNERABLE_TIME = 1200; // ms

    const player = {
      x: 80,
      y: 0,
      w: 32,
      h: 48,
      vx: 0,
      vy: 0,
      onGround: false,
      lastSafeX: 80,
      lastSafeY: 0,
      invulnerableUntil: 0,
      score: 0,
    };

    const camera = { x: 0 };

    const platforms = [
      { x: 0, y: 460, w: 2000, h: 80 },
      { x: 260, y: 380, w: 120, h: 20 },
      { x: 460, y: 330, w: 160, h: 20 },
      { x: 700, y: 280, w: 200, h: 20 },
      { x: 980, y: 350, w: 180, h: 20 },
      { x: 1280, y: 320, w: 140, h: 20 },
      { x: 1520, y: 420, w: 120, h: 20 },
    ];

    const enemies = [
      { x: 360, y: 432, w: 32, h: 28, vx: 1.2, range: [320, 520] },
      { x: 820, y: 252, w: 32, h: 28, vx: -1.4, range: [700, 900] },
      { x: 1360, y: 292, w: 32, h: 28, vx: 1.6, range: [1280, 1420] },
    ];

    function resetGame() {
      player.x = 80;
      player.y = 0;
      player.vx = 0;
      player.vy = 0;
      player.score = 0;
      player.invulnerableUntil = 0;
      camera.x = 0;
      statusEl.textContent = "重新开始！前进，顶蘑菇！";
    }

    function rectsIntersect(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function killPlayer(reason) {
      const now = performance.now();
      if (now < player.invulnerableUntil) return;

      const deathX = player.x;
      const deathY = player.y;
      player.invulnerableUntil = now + INVULNERABLE_TIME;
      statusEl.textContent = `阵亡（${reason}），原地复活！`;

      // 原地复活：把角色放回死亡位置附近，并赋予短暂无敌，避免连环击中
      player.x = deathX;
      player.y = deathY - 6;
      player.vx = 0;
      player.vy = -2;
    }

    function update(dt) {
      if (keys.restart) resetGame();

      const now = performance.now();
      const isInvul = now < player.invulnerableUntil;

      // 输入
      if (keys.left) player.vx = Math.max(player.vx - 0.6, -MOVE_SPEED);
      if (keys.right) player.vx = Math.min(player.vx + 0.6, MOVE_SPEED);
      if (!keys.left && !keys.right) player.vx *= FRICTION;

      // 跳跃
      if (keys.jump && player.onGround) {
        player.vy = -JUMP_FORCE;
        player.onGround = false;
      }

      // 重力与移动
      player.vy += GRAVITY;
      player.x += player.vx;

      // 水平碰撞
      for (const p of platforms) {
        if (rectsIntersect(player, p)) {
          if (player.vx > 0) player.x = p.x - player.w; // right hit
          else if (player.vx < 0) player.x = p.x + p.w;
          player.vx = 0;
        }
      }

      // 垂直移动与碰撞
      player.y += player.vy;
      player.onGround = false;
      for (const p of platforms) {
        if (rectsIntersect(player, p)) {
          if (player.vy > 0) {
            player.y = p.y - player.h;
            player.onGround = true;
            player.lastSafeX = player.x;
            player.lastSafeY = player.y;
          } else if (player.vy < 0) {
            player.y = p.y + p.h;
          }
          player.vy = 0;
        }
      }

      // 敌人移动与碰撞
      for (const e of enemies) {
        e.x += e.vx;
        if (e.x < e.range[0] || e.x + e.w > e.range[1]) {
          e.vx *= -1;
        }
        if (rectsIntersect(player, e) && !isInvul) {
          killPlayer("被敌人撞到");
        }
      }

      // 掉出地图
      if (player.y > canvas.height + 200) {
        player.x = player.lastSafeX;
        player.y = player.lastSafeY;
        player.vx = 0;
        player.vy = 0;
        killPlayer("掉下悬崖");
      }

      // 累计分数（随时间和前进距离）
      player.score += dt * 0.04 + Math.max(0, player.x - camera.x) * 0.0004;

      // 简单相机：让角色保持画面中线偏左
      camera.x = Math.max(0, player.x - canvas.width * 0.35);

      statusEl.textContent = isInvul ? "短暂无敌中，继续前进！" : "小心敌人，收集积分！";
      statsEl.textContent = `分数：${player.score.toFixed(0)} · 当前位置：${Math.floor(player.x)}px`;
    }

    function drawBackground() {
      ctx.fillStyle = "#7ec0ee";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 远景小山
      ctx.fillStyle = "#79c079";
      ctx.beginPath();
      ctx.moveTo(0 - camera.x * 0.2, canvas.height);
      ctx.lineTo(220 - camera.x * 0.2, 320);
      ctx.lineTo(440 - camera.x * 0.2, canvas.height);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(380 - camera.x * 0.1, canvas.height);
      ctx.lineTo(620 - camera.x * 0.1, 300);
      ctx.lineTo(860 - camera.x * 0.1, canvas.height);
      ctx.closePath();
      ctx.fill();
    }

    function drawPlatforms() {
      for (const p of platforms) {
        ctx.fillStyle = "#d8843d";
        ctx.fillRect(p.x - camera.x, p.y, p.w, p.h);
        ctx.fillStyle = "#f7b267";
        ctx.fillRect(p.x - camera.x, p.y, p.w, 10);
      }
    }

    function drawEnemies() {
      for (const e of enemies) {
        ctx.fillStyle = "#d1495b";
        ctx.fillRect(e.x - camera.x, e.y, e.w, e.h);
        ctx.fillStyle = "#fff";
        ctx.fillRect(e.x - camera.x + 6, e.y + 6, 6, 8);
        ctx.fillRect(e.x - camera.x + 20, e.y + 6, 6, 8);
      }
    }

    function drawPlayer() {
      const now = performance.now();
      const isInvul = now < player.invulnerableUntil;
      ctx.save();
      ctx.translate(player.x - camera.x, player.y);
      if (isInvul) {
        ctx.globalAlpha = 0.6 + Math.sin(now * 0.02) * 0.2;
      }

      ctx.fillStyle = "#f2d0a7";
      ctx.fillRect(8, 8, 16, 16);
      ctx.fillStyle = "#2c5282";
      ctx.fillRect(4, 24, 24, 20);
      ctx.fillStyle = "#f94c10";
      ctx.fillRect(0, 0, 32, 12);
      ctx.fillStyle = "#e76f51";
      ctx.fillRect(2, 42, 28, 6);
      ctx.restore();
    }

    let lastTime = performance.now();
    function loop() {
      const now = performance.now();
      const dt = now - lastTime;
      lastTime = now;

      update(dt);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();
      drawPlatforms();
      drawEnemies();
      drawPlayer();

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
